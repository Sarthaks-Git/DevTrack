name: Database backup

# Weekly encrypted backup of the production database (docs/DEPLOYMENT.md, "Backups").
# Secrets (repository → Settings → Secrets and variables → Actions):
#   MONGODB_BACKUP_URI  connection string of a READ-ONLY Atlas user, ending in /devtrack_prod
#   BACKUP_PASSPHRASE   long random passphrase; without it the backup cannot be opened
on:
  schedule:
    - cron: '30 21 * * 6' # Saturdays 21:30 UTC (Sunday 03:00 in India)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt, store
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Throwaway database to prove each backup restores; it exists only for this job.
    services:
      restore-check:
        image: mongo:8.0
        ports:
          - 27017:27017
    env:
      TOOLS_URL: https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2404-x86_64-100.13.0.tgz
      # Pinned so a tampered download fails the job instead of seeing the database.
      TOOLS_SHA256: 49f00ac68f25451c3e936b06011df38009f8418dafb5aa425c2810e59fd02029
    steps:
      - name: Check secrets are set
        env:
          MONGODB_BACKUP_URI: ${{ secrets.MONGODB_BACKUP_URI }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          [ -n "$MONGODB_BACKUP_URI" ] || { echo "MONGODB_BACKUP_URI is not set"; exit 1; }
          [ "${#BACKUP_PASSPHRASE}" -ge 32 ] || { echo "BACKUP_PASSPHRASE must be at least 32 characters"; exit 1; }

      - name: Install MongoDB Database Tools
        run: |
          curl -sSfL -o tools.tgz "$TOOLS_URL"
          echo "$TOOLS_SHA256  tools.tgz" | sha256sum -c -
          tar -xzf tools.tgz
          echo "$PWD/$(basename "$TOOLS_URL" .tgz)/bin" >> "$GITHUB_PATH"

      - name: Dump and encrypt
        env:
          MONGODB_BACKUP_URI: ${{ secrets.MONGODB_BACKUP_URI }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          name="devtrack-$(date -u +%Y-%m-%d).archive.gz.gpg"
          # The plain dump only ever exists in the pipe; what is written to disk is encrypted.
          mongodump --uri="$MONGODB_BACKUP_URI" --archive --gzip --quiet \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
                  --passphrase-fd 3 3<<<"$BACKUP_PASSPHRASE" --output "$name"
          size=$(stat -c %s "$name")
          [ "$size" -gt 1024 ] || { echo "Backup is suspiciously small ($size bytes)"; exit 1; }
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"
          echo "Backup written: $size bytes"

      - name: Check the backup restores
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -o pipefail
          # Decrypt and restore into the throwaway database above, never into production.
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 3<<<"$BACKUP_PASSPHRASE" --decrypt "$BACKUP_FILE"             | mongorestore --uri="mongodb://localhost:27017" --archive --gzip --drop 2>&1 | tee restore.log | tail -n 3
          restored=$(grep -oE '[0-9]+ document\(s\) restored successfully' restore.log | grep -oE '^[0-9]+' || echo 0)
          echo "Documents restored: $restored"
          [ "$restored" -gt 0 ] || { echo "The backup restored no documents"; exit 1; }
          rm -f restore.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
